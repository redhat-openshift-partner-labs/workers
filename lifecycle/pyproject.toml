[project]
name = "worker-lifecycle"
version = "0.1.0"
description = "Lifecycle worker for OpenShift Partner Labs"
requires-python = ">=3.13"
dependencies = [
    "pika>=1.3.2",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
